<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Fachada em AR</title>
  <!-- Importa o componente model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }
    header {
      padding: 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
    }
    model-viewer {
      width: 100%;
      height: 75vh;
      background-color: #1e1e1e;
    }
    /* Estilo do botão de AR */
    .ar-button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 28px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .ar-button:active {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <header>Visualização de Fachada - AR</header>

  <!-- Componente Model Viewer -->
      <model-viewer src="fachada.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  </body>
</html>
